# Eval-only. Scores groundedness of the FINAL answer against ALL retrieved
# context, on the judge route (a stronger model than the answerer),
# so the system is not grading its own homework. Never runs in production.
name: eval_judge

domains:    [health_marketing]
purposes:   [evaluation]
modalities: [unstructured]

model:
  provider: gateway
  name: judge
  effort: high        # its score gates releases; a lenient judge ships regressions
  max_tokens: 6000    # headroom: thinking tokens count against this cap

skill: ./SKILL.md

# No tools. It is handed the final answer and all retrieved context.
tools: []

budget:
  max_steps: 1

response_format: VerifierReport
