# Runs first, on every request, before anything is reachable. The cheapest
# model in the pool: this is a three-way label, not reasoning.
name: intent_router

domains:    [health_marketing]
purposes:   [classification]
modalities: [unstructured]

model:
  provider: gateway
  name: fast          # config/models.yaml
  temperature: 0.0
  max_tokens: 200

skill: ./SKILL.md

# No tools. It decides from the question alone, so it cannot be steered by
# anything retrieved — the corpus never reaches the router.
tools: []

budget:
  max_steps: 1

response_format: RouteDecision
writes: [route]
