# A second read, by a different prompt, of claims the answerer already wrote.
# It classifies; deterministic code in verify.py decides what happens next.
name: claim_verifier

domains:    [health_marketing]
purposes:   [verification]
modalities: [unstructured]

model:
  provider: gateway
  name: fast
  effort: low         # one narrow comparison per claim
  max_tokens: 4000    # headroom: thinking tokens count against this cap

skill: ./SKILL.md

# No tools. It sees only each claim and the passages that claim cites, so it
# cannot go looking for support the answerer did not cite.
tools: []

budget:
  max_steps: 1

response_format: VerifierReport
writes: [verification]
