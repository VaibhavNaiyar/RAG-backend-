# Picks the procedure (a planner skill) and scopes retrieval. Sees skills at
# Level 1 only — name + description — never their bodies.
name: planner

domains:    [health_marketing]
purposes:   [planning]
modalities: [unstructured]

model:
  provider: gateway
  name: fast
  temperature: 0.0
  max_tokens: 400

skill: ./SKILL.md
tools: []

budget:
  max_steps: 1

response_format: Plan
writes: [plan]
