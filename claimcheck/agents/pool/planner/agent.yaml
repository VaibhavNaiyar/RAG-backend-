# Picks the procedure (a planner skill) and scopes retrieval. Sees skills at
# Level 1 only — name + description — never their bodies.
name: planner

domains:    [health_marketing]
purposes:   [planning]
modalities: [unstructured]

model:
  provider: gateway
  name: fast
  effort: low         # picks from a short list; the reasoning happens downstream
  max_tokens: 1500    # headroom: thinking tokens count against this cap

skill: ./SKILL.md

# No tools. It plans from the question, the skill descriptions and the document
# catalogue; the search runs afterwards as a declared step of the chosen skill.
tools: []

budget:
  max_steps: 1

response_format: Plan
writes: [plan]
