# One document per topic, on purpose. See docs/SCALING.md for what changes at 10k.
#
# `urls` are tried in order by scripts/fetch_corpus.py. If every URL fails
# (sites move PDFs around), download the file yourself and save it as `file`.
# `kind` is what the planner scopes on; `topic` is what the goldens are grouped by.

documents:
