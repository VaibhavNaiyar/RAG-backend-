# The release gate. `python -m evals.run --gate` exits non-zero when any
# `min` is missed, any `max` is exceeded, or a metric regresses more than
# `max_regression` against evals/results/baseline.json.
#
# Set from the first honest run, then ratcheted up — never down to make a
# red run green.

min:
  route_accuracy: 0.95
  retrieval_recall: 0.90
  citation_validity: 0.95
  groundedness: 0.85
  key_fact_recall: 0.80
  verdict_accuracy: 0.85
max:
  forbidden_rate: 0.0
  cost_usd_per_q: 0.04     # measured ~$0.002 on Haiku; room to put the answerer on Sonnet
  latency_p95_ms: 25000    # set from real runs (p95 18.4-23.8 s on Haiku); 20000 was a guess

# Allowed drop vs baseline before the gate fails (absolute).
max_regression: 0.05
