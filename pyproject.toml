[project]
name = "claimcheck"
version = "0.1.0"
description = "Compliance copilot for telehealth marketing: agentic RAG with a verifier, eval harness and OTel/Langfuse observability."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "numpy>=1.26",
  "pypdf>=4",
  "rank-bm25>=0.2.2",
  "litellm>=1.50",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
# Free local embeddings + cross-encoder rerank (ONNX, no torch). Strongly recommended.
local = ["fastembed>=0.4"]
# Langfuse traces, scores, prompt management.
langfuse = ["langfuse>=3"]
# The alternative architecture: a deepagents agent with the same skills + tools.
deep = ["deepagents>=0.7", "langchain>=1.0", "langchain-anthropic", "langchain-openai"]
# Optional second opinion from DeepEval's RAG metrics.
deepeval = ["deepeval>=2"]
dev = ["pytest>=8"]

[project.scripts]
claimcheck = "claimcheck.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claimcheck*", "evals*"]

[tool.setuptools.package-data]
claimcheck = ["agents/pool/*/*", "agents/pool/*/references/*", "skills/pool/*/*", "ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
